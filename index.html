
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
}

.video-section {
  height: 400vh;
  position: relative;
}

.video-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100%;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<section class="video-section">
  <div class="video-sticky">
    <video
      id="scrollVideo"
      muted
      playsinline
      preload="auto"
      disablePictureInPicture
    >
      <source
        src="https://res.cloudinary.com/o3tqtzzc/video/upload/Intern_walking_through_office_lobby_d13c870f_2.mp4"
        type="video/mp4"
      >
    </video>
  </div>
</section>

<script>
const video = document.getElementById("scrollVideo");

video.pause();

video.addEventListener("loadedmetadata", () => {
  video.pause();

  function updateVideo() {
    const section = document.querySelector(".video-section");
    const rect = section.getBoundingClientRect();

    const scrollable = section.offsetHeight - window.innerHeight;
    const progress = Math.min(
      1,
      Math.max(0, -rect.top / scrollable)
    );

    if (Number.isFinite(video.duration)) {
      video.currentTime = progress * video.duration;
    }
  }

  window.addEventListener("scroll", updateVideo);
  window.addEventListener("resize", updateVideo);
  updateVideo();
});
</script>

</body>
</html>
